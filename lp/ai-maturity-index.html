<title>The Upcore AI Maturity Index — Free AI Coordination Score in 2 Minutes</title>
<meta name="description" content="Score your company's AI coordination across 10 dimensions in 2 minutes — instant Maturity Index, full PDF report, no sales pitch required."/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="canonical" href="https://www.upcoretech.com/lp/ai-maturity-index"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:"DM Sans",sans-serif;background:#ffffff;color:#0a0a0a;line-height:1.6;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}

#lm-root{max-width:720px;margin:0 auto;padding:56px 24px 120px;}

.lm-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#089AAA;background:rgba(10,191,204,.08);border:1px solid rgba(10,191,204,.18);border-radius:9999px;padding:5px 14px;margin-bottom:22px;}
.lm-eyebrow-dot{width:6px;height:6px;border-radius:50%;background:#0ABFCC;}
.lm-h1{font-size:clamp(30px,5vw,48px);font-weight:700;letter-spacing:-1px;line-height:1.15;margin-bottom:18px;color:#0a0a0a;}
.lm-h2{font-size:clamp(22px,3.5vw,30px);font-weight:700;letter-spacing:-.5px;margin-bottom:14px;color:#0a0a0a;}
.lm-sub{font-size:16px;color:#45515e;line-height:1.7;margin-bottom:30px;max-width:560px;}
.lm-body{font-size:14px;color:#45515e;line-height:1.75;}

.lm-cta-row{display:flex;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:10px;margin-bottom:36px;}
.lm-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 "DM Sans",sans-serif;padding:14px 28px;border-radius:9999px;border:none;cursor:pointer;transition:all .2s;text-decoration:none;}
.lm-btn-primary{background:#0ABFCC;color:#070B10;}
.lm-btn-primary:hover{background:#089AAA;transform:translateY(-1px);}
.lm-btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.lm-btn-ghost{background:transparent;color:#0a0a0a;border:1px solid #0a0a0a;}
.lm-btn-ghost:hover{background:rgba(0,0,0,.04);}
.lm-link-secondary{font-size:13px;color:#8e8e93;text-decoration:underline;}
.lm-link-secondary:hover{color:#45515e;}

.lm-proof-bar{display:flex;flex-wrap:wrap;gap:10px 20px;padding:18px 0;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;margin-bottom:40px;}
.lm-proof-item{font-size:12px;color:#45515e;}

.lm-why-now,.lm-icp,.lm-how,.lm-faq{margin-bottom:44px;}
.lm-why-now{background:#f7f8fa;border-radius:14px;padding:26px;}
.lm-icp-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.lm-icp-line{font-size:14px;font-style:italic;color:#45515e;border-left:2px solid #0ABFCC;padding-left:14px;}
.lm-icp-closing{font-size:14px;color:#0a0a0a;font-weight:600;}

.lm-how-steps{display:flex;flex-direction:column;gap:14px;}
.lm-how-step{display:flex;gap:14px;align-items:flex-start;}
.lm-how-num{width:26px;height:26px;flex-shrink:0;border-radius:50%;background:rgba(10,191,204,.1);color:#089AAA;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.lm-how-step p{font-size:14px;color:#45515e;line-height:1.6;padding-top:3px;}

.lm-faq-q{width:100%;text-align:left;background:#f7f8fa;border:1px solid #e5e7eb;border-radius:8px;padding:14px 16px;font-size:14px;font-weight:600;color:#0a0a0a;cursor:pointer;margin-bottom:6px;}
.lm-faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;margin-bottom:6px;}
.lm-faq-a p{font-size:13px;color:#45515e;line-height:1.7;padding:4px 16px 14px;}

.lm-footer-strip{text-align:center;padding-top:20px;}
.lm-legal{font-size:11px;color:#8e8e93;margin-top:12px;line-height:1.6;}
.lm-legal a{color:#45515e;text-decoration:underline;}

.lm-intro{text-align:center;padding-top:60px;}
.lm-intro .lm-btn{margin-top:20px;}

/* ── Typeform-style one-question-at-a-time quiz ─────────────────────── */
.lm-quiz{min-height:78vh;display:flex;flex-direction:column;}
@keyframes lmQuizIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.lm-quiz-anim{animation:lmQuizIn .38s cubic-bezier(.2,.7,.3,1);}

.lm-quiz-topbar{display:flex;align-items:center;gap:16px;margin-bottom:8px;}
.lm-quiz-back{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1px solid #e5e7eb;background:#fff;color:#45515e;font-size:16px;line-height:1;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.lm-quiz-back:hover{border-color:#0ABFCC;color:#089AAA;}
.lm-quiz-back-hidden{visibility:hidden;pointer-events:none;}
.lm-quiz-progress-track{flex:1;height:4px;border-radius:2px;background:#e5e7eb;overflow:hidden;}
.lm-quiz-progress-fill{height:100%;background:#0ABFCC;border-radius:2px;transition:width .35s ease;}
.lm-quiz-count{flex-shrink:0;font-size:12px;font-weight:600;color:#8e8e93;}

.lm-quiz-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:640px;margin:0 auto;width:100%;padding:48px 0;}
.lm-quiz-eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#089AAA;margin-bottom:16px;}
.lm-question{margin-bottom:0;}
.lm-question-text{font-size:clamp(22px,3.6vw,32px);font-weight:700;margin-bottom:28px;line-height:1.35;letter-spacing:-.3px;color:#0a0a0a;}

.lm-options{display:flex;flex-direction:column;gap:10px;}
.lm-option{display:flex;align-items:center;gap:14px;text-align:left;background:#ffffff;border:1px solid #e5e7eb;border-radius:10px;padding:16px 18px;font:inherit;font-size:15px;color:#0a0a0a;cursor:pointer;transition:all .15s;}
.lm-option:hover{border-color:#0ABFCC;background:rgba(10,191,204,.04);transform:translateX(4px);}
.lm-option-selected{border-color:#0ABFCC;background:rgba(10,191,204,.08);}
.lm-opt-num{flex-shrink:0;width:28px;height:28px;border-radius:7px;border:1px solid #d7dbe0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#8e8e93;transition:all .15s;}
.lm-option-selected .lm-opt-num{background:#0ABFCC;border-color:#0ABFCC;color:#fff;}
.lm-opt-text{flex:1;}
.lm-opt-check{flex-shrink:0;color:#089AAA;font-weight:700;font-size:18px;}
.lm-continue-btn{margin-top:24px;width:100%;}
.lm-quiz-hint{margin-top:20px;font-size:11px;color:#8e8e93;}

/* Insight interrupt (its own full screen, not a stacked card) */
.lm-insight-screen{text-align:center;align-items:center;}
.lm-insight-badge{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#089AAA;margin-bottom:18px;}
.lm-insight-copy{font-size:19px;line-height:1.65;color:#0a0a0a;max-width:520px;margin:0 0 32px;}

.lm-score-blur{font-size:48px;font-weight:700;color:#c4c9d4;filter:blur(6px);text-align:center;margin:20px 0;}
.lm-weak-line,.lm-peer-line{font-size:14px;color:#45515e;text-align:center;margin:14px 0;line-height:1.6;}
.lm-weak-callout{background:#f7f8fa;border-left:3px solid #0ABFCC;border-radius:0 8px 8px 0;padding:16px 18px;margin:20px 0;}
.lm-weak-callout p{font-size:13px;color:#45515e;line-height:1.65;}

.lm-email-gate{background:#f7f8fa;border:1px solid #e5e7eb;border-radius:14px;padding:26px;margin-top:26px;}
.lm-gate-copy{font-size:14px;color:#45515e;margin-bottom:16px;}
.lm-gate-form{display:flex;flex-direction:column;gap:10px;}
.lm-input{background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;padding:12px 14px;font-size:14px;color:#0a0a0a;font-family:inherit;}
.lm-input:focus{outline:none;border-color:#0ABFCC;}
.lm-input::placeholder{color:#8e8e93;}

.lm-radar-svg{display:block;margin:20px auto;width:100%;max-width:340px;}
.lm-radar-grid{fill:none;stroke:#e5e7eb;stroke-width:1;}
.lm-radar-data{fill:rgba(10,191,204,.14);stroke:#0ABFCC;stroke-width:2;}
.lm-radar-label{font-size:8px;fill:#45515e;}
.lm-blurred{filter:blur(5px);opacity:.6;}

.lm-maturity-curve-svg{display:block;margin:24px auto;width:100%;max-width:520px;}
.lm-curve-line{stroke:#c4c9d4;stroke-width:2;}
.lm-curve-dot{fill:#c4c9d4;}
.lm-curve-dot-active{fill:#0ABFCC;}
.lm-curve-label{font-size:11px;fill:#45515e;font-weight:600;}
.lm-curve-marker{font-size:10px;fill:#089AAA;font-weight:700;}

.lm-sticky-cta{position:fixed;left:0;right:0;bottom:-80px;background:#ffffff;border-top:1px solid #e5e7eb;box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:12px 20px;display:flex;justify-content:center;z-index:999;transition:bottom .25s ease;}
.lm-sticky-visible{bottom:0;}
.lm-sticky-cta .lm-btn{width:100%;max-width:340px;}

@media(max-width:600px){ #lm-root{padding:40px 18px 120px;} }
</style>
</head>
