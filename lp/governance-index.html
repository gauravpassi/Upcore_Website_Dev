<title>The Upcore Governance Index — Free AI Governance Score in 2 Minutes</title>
<meta name="description" content="Score your AI code governance across 5 layers in 2 minutes — instant Index score, full PDF report, no sales pitch required."/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="canonical" href="https://www.upcoretech.com/lp/governance-index"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:"DM Sans",sans-serif;background:#0A0A0A;color:rgba(255,255,255,.92);line-height:1.6;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
.lm-mono{font-family:"JetBrains Mono",monospace;}

#lm-root{max-width:720px;margin:0 auto;padding:56px 24px 120px;}

.lm-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#0ABFCC;background:rgba(10,191,204,.1);border:1px solid rgba(10,191,204,.2);border-radius:9999px;padding:5px 14px;margin-bottom:22px;}
.lm-eyebrow-dot{width:6px;height:6px;border-radius:50%;background:#0ABFCC;}
.lm-h1{font-size:clamp(30px,5vw,48px);font-weight:700;letter-spacing:-1px;line-height:1.1;margin-bottom:18px;}
.lm-h2{font-size:clamp(22px,3.5vw,32px);font-weight:700;letter-spacing:-.5px;margin-bottom:14px;}
.lm-sub{font-size:16px;color:rgba(255,255,255,.6);line-height:1.7;margin-bottom:30px;max-width:560px;}
.lm-body{font-size:14px;color:rgba(255,255,255,.65);line-height:1.75;}

.lm-cta-row{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:36px;}
.lm-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 "DM Sans",sans-serif;padding:14px 28px;border-radius:9999px;border:none;cursor:pointer;transition:all .2s;text-decoration:none;}
.lm-btn-primary{background:#0ABFCC;color:#070B10;}
.lm-btn-primary:hover{background:#089AAA;transform:translateY(-1px);}
.lm-btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.lm-btn-ghost{background:transparent;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.25);}
.lm-btn-ghost:hover{border-color:rgba(255,255,255,.5);}
.lm-link-secondary{font-size:13px;color:rgba(255,255,255,.45);text-decoration:underline;}
.lm-link-secondary:hover{color:rgba(255,255,255,.7);}

.lm-hero-widget{background:#111417;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;margin-bottom:32px;}
.lm-hero-widget-header{padding:10px 16px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.07);font-family:"JetBrains Mono",monospace;}
.lm-hero-widget-body{padding:12px 16px;}
.lm-hero-widget-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;}
.lm-hero-widget-status{color:#3ddcc4;font-family:"JetBrains Mono",monospace;font-size:11px;}

.lm-proof-bar{display:flex;flex-wrap:wrap;gap:10px 20px;padding:18px 0;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:40px;}
.lm-proof-item{font-size:12px;color:rgba(255,255,255,.55);}

.lm-why-now,.lm-icp,.lm-how,.lm-faq{margin-bottom:44px;}
.lm-icp-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.lm-icp-line{font-size:14px;font-style:italic;color:rgba(255,255,255,.7);border-left:2px solid #0ABFCC;padding-left:14px;}
.lm-icp-closing{font-size:14px;color:rgba(255,255,255,.8);font-weight:600;}

.lm-how-steps{display:flex;flex-direction:column;gap:14px;}
.lm-how-step{display:flex;gap:14px;align-items:flex-start;}
.lm-how-num{width:26px;height:26px;flex-shrink:0;border-radius:50%;background:rgba(10,191,204,.12);color:#0ABFCC;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.lm-how-step p{font-size:14px;color:rgba(255,255,255,.7);line-height:1.6;padding-top:3px;}

.lm-faq-q{width:100%;text-align:left;background:#111417;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:14px 16px;font-size:14px;font-weight:600;color:rgba(255,255,255,.9);cursor:pointer;margin-bottom:6px;}
.lm-faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;margin-bottom:6px;}
.lm-faq-a p{font-size:13px;color:rgba(255,255,255,.6);line-height:1.7;padding:4px 16px 14px;}

.lm-footer-strip{text-align:center;padding-top:20px;}
.lm-legal{font-size:11px;color:rgba(255,255,255,.35);margin-top:12px;line-height:1.6;}
.lm-legal a{color:rgba(255,255,255,.5);text-decoration:underline;}

/* Intro screen */
.lm-intro{text-align:center;padding-top:60px;}
.lm-intro .lm-btn{margin-top:20px;}

/* ── Typeform-style one-question-at-a-time quiz ─────────────────────── */
.lm-quiz{min-height:78vh;display:flex;flex-direction:column;}
@keyframes lmQuizIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.lm-quiz-anim{animation:lmQuizIn .38s cubic-bezier(.2,.7,.3,1);}

.lm-quiz-topbar{display:flex;align-items:center;gap:16px;margin-bottom:8px;}
.lm-quiz-back{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.7);font-size:16px;line-height:1;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.lm-quiz-back:hover{border-color:#0ABFCC;color:#0ABFCC;}
.lm-quiz-back-hidden{visibility:hidden;pointer-events:none;}
.lm-quiz-progress-track{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;}
.lm-quiz-progress-fill{height:100%;background:#0ABFCC;border-radius:2px;transition:width .35s ease;}
.lm-quiz-count{flex-shrink:0;font-family:"JetBrains Mono",monospace;font-size:12px;color:rgba(255,255,255,.4);}

.lm-quiz-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:640px;margin:0 auto;width:100%;padding:48px 0;}
.lm-quiz-eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#0ABFCC;margin-bottom:16px;font-family:"JetBrains Mono",monospace;}
.lm-question{margin-bottom:0;}
.lm-question-text{font-size:clamp(22px,3.6vw,32px);font-weight:600;margin-bottom:28px;line-height:1.35;letter-spacing:-.3px;}

.lm-options{display:flex;flex-direction:column;gap:10px;}
.lm-option{display:flex;align-items:center;gap:14px;text-align:left;background:#111417;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:16px 18px;font:inherit;font-size:15px;color:rgba(255,255,255,.85);cursor:pointer;transition:all .15s;}
.lm-option:hover{border-color:rgba(10,191,204,.5);background:rgba(10,191,204,.06);transform:translateX(4px);}
.lm-option-selected{border-color:#0ABFCC;background:rgba(10,191,204,.12);}
.lm-opt-num{flex-shrink:0;width:28px;height:28px;border-radius:7px;border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;color:rgba(255,255,255,.5);transition:all .15s;}
.lm-option-selected .lm-opt-num{background:#0ABFCC;border-color:#0ABFCC;color:#070B10;}
.lm-opt-text{flex:1;}
.lm-opt-check{flex-shrink:0;color:#0ABFCC;font-weight:700;font-size:18px;}
.lm-continue-btn{margin-top:24px;width:100%;}
.lm-quiz-hint{margin-top:20px;font-size:11px;color:rgba(255,255,255,.3);}

/* Insight interrupt (its own full screen, not a stacked card) */
.lm-insight-screen{text-align:center;align-items:center;}
.lm-insight-badge{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#0ABFCC;margin-bottom:18px;font-family:"JetBrains Mono",monospace;}
.lm-insight-copy{font-size:19px;line-height:1.65;color:rgba(255,255,255,.88);max-width:520px;margin:0 0 32px;}

/* Teaser / Full result */
.lm-score-blur{font-family:"JetBrains Mono",monospace;font-size:48px;font-weight:700;color:rgba(255,255,255,.15);filter:blur(6px);text-align:center;margin:20px 0;}
.lm-weak-line,.lm-peer-line{font-size:14px;color:rgba(255,255,255,.65);text-align:center;margin:14px 0;line-height:1.6;}
.lm-weak-callout{background:#111417;border-left:3px solid #0ABFCC;border-radius:0 8px 8px 0;padding:16px 18px;margin:20px 0;}
.lm-weak-callout p{font-size:13px;color:rgba(255,255,255,.7);line-height:1.65;}

.lm-email-gate{background:#111417;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:26px;margin-top:26px;}
.lm-gate-copy{font-size:14px;color:rgba(255,255,255,.7);margin-bottom:16px;}
.lm-gate-form{display:flex;flex-direction:column;gap:10px;}
.lm-input{background:#0d0f11;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:12px 14px;font-size:14px;color:#fff;font-family:inherit;}
.lm-input:focus{outline:none;border-color:#0ABFCC;}
.lm-input::placeholder{color:rgba(255,255,255,.3);}

.lm-radar-svg{display:block;margin:20px auto;width:100%;max-width:320px;}
.lm-radar-grid{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1;}
.lm-radar-data{fill:rgba(10,191,204,.18);stroke:#0ABFCC;stroke-width:2;}
.lm-radar-label{font-size:9px;fill:rgba(255,255,255,.5);font-family:"JetBrains Mono",monospace;}
.lm-blurred{filter:blur(5px);opacity:.6;}

.lm-cta-row{flex-direction:row;flex-wrap:wrap;}

/* Sticky CTA */
.lm-sticky-cta{position:fixed;left:0;right:0;bottom:-80px;background:#0A0A0A;border-top:1px solid rgba(255,255,255,.1);padding:12px 20px;display:flex;justify-content:center;z-index:999;transition:bottom .25s ease;}
.lm-sticky-visible{bottom:0;}
.lm-sticky-cta .lm-btn{width:100%;max-width:340px;}

@media(max-width:600px){ #lm-root{padding:40px 18px 120px;} }
</style>
